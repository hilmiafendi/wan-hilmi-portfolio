      - name: frames
        label: Gallery Photographs
        type: object
        list: true
        fields:
          - name: src
            label: Photograph
            type: image
          - name: title
            label: Title
            type: string
          - name: category
            label: Category
            type: select
            options:
              values:
                - value: corporate
                  label: Corporate
                - value: convocation
                  label: Convocation
                - value: fashion
                  label: Fashion
                - value: sports
                  label: Sports
                - value: birthday
                  label: Birthday
          - name: location
            label: Location
            type: string
          - name: exif
            label: Camera / Lens EXIF
            type: string
