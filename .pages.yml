media:
  input: images
  output: /images

content:
  - name: frames
    label: Gallery Photographs
    type: collection
    path: frames
    extension: json
    view:
      fields: [title, category, location, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: src
        label: Photograph
        type: image
      - name: title
        label: Title
        type: string
      - name: category
        label: Category
        type: select
        options:
          values:
            - value: corporate
              label: Corporate
            - value: convocation
              label: Convocation
            - value: fashion
              label: Fashion
            - value: sports
              label: Sports
            - value: birthday
              label: Birthday
      - name: location
        label: Location
        type: string
      - name: exif
        label: Camera / Lens EXIF
        type: string
      - name: date
        label: Shoot Date (newest shows first)
        type: date

  - name: settings
    label: Site Settings & Bio
    type: file
    path: data.json
    fields:
      - name: profile
        label: Profile & Contact Info
        type: object
        fields:
          - name: pageTitle
            label: Page Title
            type: string
          - name: metaDescription
            label: Meta Description
            type: text
          - name: brandName
            label: Brand Wordmark
            type: string
          - name: fullName
            label: Full Name (Copyright)
            type: string
          - name: copyrightYear
            label: Copyright Year
            type: string
          - name: locationShort
            label: Header Location
            type: string
          - name: locationFull
            label: Drawer Location
            type: string
          - name: bioParagraph1
            label: Bio Paragraph 1
            type: text
          - name: bioParagraph2
            label: Bio Paragraph 2
            type: text
          - name: bioParagraph3
            label: Bio Paragraph 3
            type: text
          - name: whatsappNumber
            label: WhatsApp Number (with country code, e.g. 60106540039)
            type: string
          - name: email
            label: Direct Email
            type: string
          - name: instagramUrl
            label: Instagram URL
            type: string
      - name: categories
        label: Portfolio Categories
        type: object
        list: true
        fields:
          - name: id
            label: Category ID (e.g. corporate)
            type: string
          - name: label
            label: Display Name
            type: string
